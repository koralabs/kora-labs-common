name: kora-labs-common PR checks
on:
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  test:
    name: Lint, build and unit tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Unit tests
      run: |
        npm run test
        node --test scripts/verify-npm-publish.test.cjs
