name: kora-labs-common
on:
  push:
    branches:
      - master
    # Tooling/docs-only merges do not publish an unchanged library version.
    paths-ignore:
      - '.github/**'
      - 'scripts/**'
      - 'docs/**'
      - '.local-test-evidence.json'
  workflow_dispatch:
permissions:
  id-token: write  # Required for OIDC
  contents: read
  packages: write  # Required for GitHub Packages publish
jobs:
  deploy:
    name: Deploying from ${{ github.ref_name }}
    environment: mainnet
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Verify local test evidence (tests run locally, never in Actions)
      run: |
        c=$(jq -er 'select(.result == "pass") | .commit' .local-test-evidence.json) && git diff --quiet "$c" HEAD -- . ':!.local-test-evidence.json' || { echo "::error::no valid local test evidence for this commit: run adahandle-deployments/common/test-evidence.sh record locally and push the evidence commit"; exit 1; }

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 26
        registry-url: https://registry.npmjs.org

    - name: Install
      run: npm ci

    - name: Build
      run: npm run build && cp package.json ./lib/package.json

    - name: Publish to GitHub Packages
      run: |
        npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}
        cd ./lib && npm publish --@koralabs:registry='https://npm.pkg.github.com'

    - name: Publish to npmjs
      run: cd ./lib && npm publish --provenance --access public

    - name: Verify exact version on npmjs
      run: node scripts/verify-npm-publish.cjs ./lib/package.json
