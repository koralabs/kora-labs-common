name: kora-labs-common
on:
  push:
    branches:
      - master
    # Tooling/docs-only merges do not publish an unchanged library version.
    paths-ignore:
      - '.github/**'
      - 'scripts/**'
      - 'docs/**'
  workflow_dispatch:
permissions:
  id-token: write  # Required for OIDC
  contents: read
  packages: write  # Required for GitHub Packages publish
jobs:
  deploy:
    name: Deploying from ${{ github.ref_name }}
    environment: mainnet
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org

    - name: Install
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test
      run: |
        npm run test
        node --test scripts/verify-npm-publish.test.cjs

    - name: Build
      run: npm run build && cp package.json ./lib/package.json

    - name: Publish to GitHub Packages
      run: |
        npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}
        cd ./lib && npm publish --@koralabs:registry='https://npm.pkg.github.com'

    - name: Publish to npmjs
      run: cd ./lib && npm publish --provenance --access public

    - name: Verify exact version on npmjs
      run: node scripts/verify-npm-publish.cjs ./lib/package.json
